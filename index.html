<!doctype html>
<html lang="es" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Listentoo</title>
<meta name="description" content="Listentoo: millones de canciones, artistas y álbumes. Tu música en órbita, en todos tus dispositivos.">
<meta name="theme-color" content="#08070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listentoo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.deezer.com">
<link rel="preconnect" href="https://cdn-images.dzcdn.net" crossorigin>
<link rel="preconnect" href="https://mmengqeunonzusaxtdrm.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="modulepreload" href="js/main.js">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // paint the chosen theme's background before CSS/JS load to avoid a flash
  try { var s = JSON.parse(localStorage.getItem('lt:settings') || '{}'), t = s.theme || 'aurora';
    var light = { nube: '#f5f4fb', sakura: '#fff6f8', arena: '#faf6ef' }, dark = { medianoche: '#000', neon: '#05030a', oceano: '#020b16', bosque: '#050d08', atardecer: '#110608' };
    if (t === 'sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'nube' : 'aurora';
    var bg = light[t] || dark[t] || '#08070f'; document.documentElement.style.background = bg; document.documentElement.dataset.mode = light[t] ? 'light' : 'dark';
  } catch (e) {}
</script>
</head>
<body>
<canvas id="nebula" aria-hidden="true"></canvas>
<div id="aurora" aria-hidden="true"></div>

<div id="app">
  <header id="top">
    <div class="top-left">
      <a class="logo" href="#/inicio" aria-label="Listentoo, inicio"><img src="icons/icon.svg" alt="" width="34" height="34"><span>listentoo</span></a>
      <div class="navbtns"><button id="back" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="fwd" aria-label="Adelante"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>
    <div class="island-slot"></div>
    <div class="top-right">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><input id="searchInput" type="search" placeholder="Busca música…" autocomplete="off" enterkeyhint="search" aria-label="Buscar"><kbd>/</kbd></label>
      <button class="pill sm install" id="installBtn" hidden>Instalar</button>
      <button class="theme-btn" id="themeBtn" aria-label="Temas" title="Temas"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.5-1-2.6 0-1 .8-1.7 1.9-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.4"/><circle cx="10.5" cy="7.5" r="1.4"/><circle cx="15" cy="7.8" r="1.4"/></svg></button>
      <a class="acct" id="accountBtn" href="#/cuenta"><span>Entrar</span></a>
    </div>
  </header>
  <main id="main" tabindex="-1"><div id="view" class="view"></div></main>
</div>

<!-- ============ THE ISLAND: a living mini-player ============ -->
<div id="island" data-state="idle" role="region" aria-label="Reproductor">
  <div class="is-row">
    <button class="is-art" id="isOpen" aria-label="Abrir reproductor"><img id="isCover" src="icons/cover.svg" alt=""><svg class="is-ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5"/></svg></button>
    <div class="is-text"><div class="is-title"><span id="isTitle">Elige algo para escuchar</span></div><div class="is-artist" id="isArtist">listentoo</div></div>
    <span class="is-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <button class="is-btn" id="isPlay" aria-label="Reproducir" data-magnet></button>
  </div>
  <div class="is-more"><div class="is-more-in">
    <div class="is-seek"><span data-cur>0:00</span><div class="slider" id="isSeek" role="slider" aria-label="Progreso" tabindex="0"><div class="track"><div class="fill"></div></div><div class="knob"></div></div><span data-dur>0:00</span></div>
    <div class="is-ctrls">
      <button class="iconbtn" id="isLike" aria-label="Me gusta"></button>
      <button class="iconbtn" id="isShuffle" aria-label="Aleatorio" title="Aleatorio"></button>
      <button class="iconbtn" id="isPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M19 5.6v12.8a1 1 0 0 1-1.53.85L8 13.1V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v4.9l9.47-6.15A1 1 0 0 1 19 5.6z"/></svg></button>
      <button class="playbtn" id="isPlay2" aria-label="Reproducir"></button>
      <button class="iconbtn" id="isNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M5 5.6v12.8a1 1 0 0 0 1.53.85L16 13.1V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.9L6.53 4.75A1 1 0 0 0 5 5.6z"/></svg></button>
      <button class="iconbtn" id="isRepeat" aria-label="Repetir"></button>
      <button class="iconbtn" id="isQueue" aria-label="Cola" title="Cola"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7M15.5 14.5v6l5-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="is-foot"><span class="mode-badge" data-mode-badge hidden></span><div class="vol"><button class="iconbtn sm" id="isMute" aria-label="Silenciar"></button><div class="slider" id="isVol" role="slider" aria-label="Volumen" tabindex="0"><div class="track"><div class="fill"></div></div><div class="knob"></div></div></div><button class="pill sm ghost" id="isExpand">Abrir órbita ↗</button></div>
  </div></div>
</div>

<!-- ============ DOCK ============ -->
<nav id="dock" aria-label="Navegación">
  <span class="dock-glow"></span>
  <a href="#/inicio" data-nav="inicio"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Inicio</span></a>
  <a href="#/explorar" data-nav="explorar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 8.5-2 5-5 2 2-5z" fill="currentColor"/></svg><span>Explorar</span></a>
  <a href="#/radio" data-nav="radio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 19a10 10 0 0 1 0-14M19 5a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Radio</span></a>
  <a href="#/biblioteca" data-nav="biblioteca"><svg viewBox="0 0 24 24"><path d="M5 4v16M9.5 4v16M14 5l4.5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Biblioteca</span></a>
  <a href="#/perfil" data-nav="perfil" id="dockMe"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Tú</span></a>
</nav>

<!-- ============ ORBIT: full-screen player ============ -->
<section id="orbit" aria-label="Reproduciendo" hidden>
  <div class="or-bg"><img id="orBg" alt="" src="icons/cover.svg"></div>
  <div class="or-inner">
    <header class="or-head">
      <button class="iconbtn" id="orClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="or-ctx"><small>Sonando desde</small><a id="orCtx" class="ellipsis" href="#/cola"></a></div>
      <button class="iconbtn" id="orMore" aria-label="Más"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg></button>
    </header>
    <div class="or-body">
      <div class="or-stage" id="orStage">
        <div class="or-3d">
          <div class="or-halo"></div>
          <div class="or-disc"><img id="orCover" alt="" src="icons/cover.svg"><span class="or-grooves"></span><span class="or-hole"></span></div>
          <svg class="or-ring" id="orRing" viewBox="0 0 220 220" aria-label="Progreso circular">
            <circle class="r-track" cx="110" cy="110" r="104"/><circle class="r-prog" id="orProg" cx="110" cy="110" r="104"/>
            <circle class="r-hit" cx="110" cy="110" r="104"/><circle class="r-knob" id="orKnob" cx="110" cy="6" r="6"/>
          </svg>
          <div class="or-moons"><i></i><i></i><i></i></div>
        </div>
        <div class="or-screen" id="orScreen"></div>
      </div>
      <div class="or-side">
        <div class="or-meta"><div class="or-titles"><div id="orTitle" class="or-title ellipsis2"></div><a id="orArtist" class="or-artist ellipsis" href="#/cola"></a></div><button class="likebtn lg" id="orLike" aria-label="Me gusta"></button></div>
        <div class="or-seek"><div class="slider lg" id="orSeek" role="slider" aria-label="Progreso" tabindex="0"><div class="track"><div class="fill"></div></div><div class="knob"></div></div><div class="or-times"><span data-cur>0:00</span><span class="mode-badge" data-mode-badge hidden></span><span data-dur>0:00</span></div></div>
        <div class="or-ctrls">
          <button class="iconbtn" id="orShuffle" aria-label="Aleatorio"></button>
          <button class="iconbtn lg" id="orPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M19 5.6v12.8a1 1 0 0 1-1.53.85L8 13.1V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v4.9l9.47-6.15A1 1 0 0 1 19 5.6z"/></svg></button>
          <button class="playbtn xl" id="orPlay" aria-label="Reproducir" data-magnet></button>
          <button class="iconbtn lg" id="orNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M5 5.6v12.8a1 1 0 0 0 1.53.85L16 13.1V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.9L6.53 4.75A1 1 0 0 0 5 5.6z"/></svg></button>
          <button class="iconbtn" id="orRepeat" aria-label="Repetir"></button>
        </div>
        <div class="or-tools">
          <button class="iconbtn" id="orSleep" aria-label="Temporizador" title="Temporizador"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          <div class="vol"><button class="iconbtn sm" id="orMute" aria-label="Silenciar"></button><div class="slider" id="orVol" role="slider" aria-label="Volumen" tabindex="0"><div class="track"><div class="fill"></div></div><div class="knob"></div></div></div>
          <button class="iconbtn" id="orShare" aria-label="Compartir" title="Compartir"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 13v6.5h14V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="or-tabs" role="tablist"><button data-tab="lyrics" class="on">Letra</button><button data-tab="next">A continuación</button></div>
        <div class="or-panel"><div class="lyrics" id="orLyrics"></div><div id="orNextList" class="next-list" hidden></div></div>
      </div>
    </div>
  </div>
</section>


<!-- Official YouTube player: sandboxed (cannot open tabs or windows) and kept visible while it plays -->
<div id="holo" hidden>
  <div class="holo-head"><span class="holo-dot"></span><span class="holo-lbl">YouTube · completa</span><button id="holoMove" aria-label="Mover a otra esquina" title="Mover">⇄</button><button id="holoOpen" aria-label="Abrir reproductor" title="Abrir">⤢</button></div>
  <div class="holo-screen"><div id="ytHost"></div></div>
  <div class="holo-tap" id="holoTap" hidden>Toca el vídeo una vez para activar el sonido</div>
</div>

<div id="menu" class="menu" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="filePicker" type="file" accept="audio/*" multiple hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
