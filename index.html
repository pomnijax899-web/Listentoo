<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Listentoo</title>
<meta name="description" content="Listentoo: escucha música online, crea playlists y llévala a cualquier dispositivo.">
<meta name="theme-color" content="#0b0b12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listentoo">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="32" height="32"><span>Listentoo</span></div>
    <nav>
      <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-7h6v7h6V10z"/></svg><span>Inicio</span></a>
      <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 5 14.2l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg><span>Buscar</span></a>
      <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.6.4 1.9-.5 4.5 17.2-1.9.5z"/></svg><span>Biblioteca</span></a>
    </nav>
    <div class="side-section">
      <div class="side-head"><span>Tus playlists</span><button id="newPlaylistBtn" class="icon-btn" title="Crear playlist" aria-label="Crear playlist">＋</button></div>
      <div id="sidePlaylists"></div>
    </div>
    <button id="installBtn" class="install-btn" hidden>⬇ Instalar app</button>
  </aside>

  <main id="main" tabindex="-1"><div id="view"></div></main>

  <div id="playerBar">
    <div class="pb-track" id="pbTrack">
      <img id="pbCover" alt="" src="icons/cover.svg">
      <div class="pb-meta"><div id="pbTitle" class="ellipsis">Nada sonando</div><div id="pbArtist" class="ellipsis muted">—</div></div>
      <button id="pbLike" class="icon-btn like" aria-label="Me gusta">♡</button>
    </div>
    <div class="pb-center">
      <div class="controls">
        <button id="btnShuffle" class="icon-btn" title="Aleatorio" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4 4-1.4-1.4 4-4zM3 6h4.5l9 12H21v2h-5.5l-9-12H3zm11.1 7.6 1.4 1.4-4 4H21v2h-9.5l-1.5-1.5z" transform="scale(.9) translate(1 1)"/></svg></button>
        <button id="btnPrev" class="icon-btn" title="Anterior" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
        <button id="btnPlay" class="play-btn" title="Reproducir/Pausar" aria-label="Reproducir"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><svg id="icoPause" viewBox="0 0 24 24" hidden><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
        <button id="btnNext" class="icon-btn" title="Siguiente" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7L5 19z"/></svg></button>
        <button id="btnRepeat" class="icon-btn" title="Repetir" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><i id="repeatOne" hidden>1</i></button>
      </div>
      <div class="seek"><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Progreso"><span id="tDur">0:00</span></div>
    </div>
    <div class="pb-right">
      <button id="btnQueue" class="icon-btn" title="Cola" aria-label="Cola"><svg viewBox="0 0 24 24"><path d="M3 5h14v2H3zm0 6h14v2H3zm0 6h9v2H3zm13-1v-2h2v2h2v2h-2v2h-2v-2h-2v-2z"/></svg></button>
      <button id="btnMute" class="icon-btn" title="Silenciar" aria-label="Volumen"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
      <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volumen">
      <button id="btnExpand" class="icon-btn" title="Pantalla completa" aria-label="Ampliar reproductor"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </div>

  <nav id="tabbar">
    <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-7h6v7h6V10z"/></svg><span>Inicio</span></a>
    <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 5 14.2l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg><span>Buscar</span></a>
    <a href="#/library" data-nav="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm5.6.4 1.9-.5 4.5 17.2-1.9.5z"/></svg><span>Biblioteca</span></a>
  </nav>
</div>

<section id="npFull" hidden aria-label="Reproduciendo ahora">
  <button id="npClose" class="icon-btn np-close" aria-label="Cerrar">⌄</button>
  <img id="npCover" alt="" src="icons/cover.svg">
  <div class="np-meta"><div id="npTitle" class="np-title"></div><div id="npArtist" class="muted"></div></div>
  <div class="seek"><span id="npCur">0:00</span><input id="npSeek" type="range" min="0" max="1000" value="0" aria-label="Progreso"><span id="npDur">0:00</span></div>
  <div class="controls big">
    <button id="npShuffle" class="icon-btn" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4 4-1.4-1.4 4-4zM3 6h4.5l9 12H21v2h-5.5l-9-12H3zm11.1 7.6 1.4 1.4-4 4H21v2h-9.5l-1.5-1.5z" transform="scale(.9) translate(1 1)"/></svg></button>
    <button id="npPrev" class="icon-btn" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
    <button id="npPlay" class="play-btn" aria-label="Reproducir"><svg id="npIcoPlay" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><svg id="npIcoPause" viewBox="0 0 24 24" hidden><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
    <button id="npNext" class="icon-btn" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7L5 19z"/></svg></button>
    <button id="npRepeat" class="icon-btn" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
  <div class="np-actions"><button id="npLike" class="icon-btn like" aria-label="Me gusta">♡</button><button id="npQueue" class="icon-btn" aria-label="Cola">☰ Cola</button><button id="npMore" class="icon-btn" aria-label="Más">⋯</button></div>
</section>

<div id="menu" class="menu" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="filePicker" type="file" accept="audio/*" multiple hidden>

<script src="app.js"></script>
</body>
</html>
